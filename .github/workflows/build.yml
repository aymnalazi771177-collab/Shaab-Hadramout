name: Build Shaab Hadramout Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - modern-ui-approved-mockup-20261121

permissions:
  contents: read

concurrency:
  group: shaab-hadramout-android
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          tools: ''
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Prepare web assets
        run: |
          mkdir -p www/assets
          cp index.html styles.css app.js modern-ui.css www/
          cp -R assets/. www/assets/
          base64 -d assets/club-logo.png.b64 > www/assets/logo.png

      - name: Create Android project
        run: npx cap add android

      - name: Sync app assets
        run: npx cap sync android

      - name: Build installable APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shaab-Hadramout-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
